<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYE AYE RECORDS | Signal Command</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=5.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <main class="main-ui">
        <header class="terminal-header">
            <div class="serial-number">STATUS: TRANSMITTING... // AYE AYE RECORDS</div>
            <h1 class="logo-text">AYE AYE RECORDS</h1>
            <div class="tagline">// SONIC ARCHEOLOGY // 0/1 //</div>
        </header>
    </main>

    <div class="volcano-sound-container right-axis">
        <div id="track-log" class="track-log">LOG: GILLESTEP - DISCOLOW [2026]</div>
        <button id="beat-btn" class="beat-btn" onclick="toggleBeat()">[ BEAT: OFF ]</button>
    </div>

    <footer>
        <div class="footer-block left">
            <nav class="command-menu">
                <a href="#releases" class="cmd-link">[ LOG_RELEASES ]</a>
                <a href="#manifesto" class="cmd-link">[ MANIFESTO ]</a>
                <a href="#connect" class="cmd-link">[ CONNECT ]</a>
            </nav>
            <a href="mailto:info@ayeayerecords.com" target="_blank" class="footer-link">
                <i class="fa-regular fa-envelope"></i>
                <span>Booking | info@ayeayerecords.com</span>
            </a>
        </div>

        <div class="footer-block right">
            <a href="https://www.instagram.com/ayeayerecords" target="_blank" class="footer-link">
                <span>Instagram</span>
                <i class="fa-brands fa-instagram"></i>
            </a>
        </div>
    </footer>

    <audio id="audio-track" loop preload="auto" crossorigin="anonymous">
        <source src="media/Discolow_Gillestep.mp3" type="audio/mpeg">
    </audio>

    <script>
        let audio = document.getElementById('audio-track');
        let btn = document.getElementById('beat-btn');
        let trackLog = document.getElementById('track-log');
        let isPlaying = false;

        window.audioAmp = 0;
        let audioCtx, analyser, source, dataArray;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                function update() {
                    requestAnimationFrame(update);
                    if (isPlaying) {
                        analyser.getByteFrequencyData(dataArray);
                        let sum = 0;
                        for(let i=0; i<dataArray.length; i++) sum += dataArray[i];
                        window.audioAmp = sum / dataArray.length;
                    } else { window.audioAmp = 0; }
                }
                update();
            }
        }

        function toggleBeat() {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (isPlaying) {
                audio.pause();
                btn.innerText = "[ BEAT: OFF ]";
                btn.classList.remove('playing');
                trackLog.classList.remove('active');
            } else {
                audio.play();
                btn.innerText = "[ BEAT: ON ]";
                btn.classList.add('playing');
                trackLog.classList.add('active');
            }
            isPlaying = !isPlaying;
        }
    </script>
    <script src="sketch.js?v=5.0"></script>
</body>
</html>
